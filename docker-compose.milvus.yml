services:
  etcd:  # ← 服务名（容器间用这个名字访问）
    container_name: milvus-etcd  # 容器实际名字（docker ps 看到的）
    image: quay.m.daocloud.io/coreos/etcd:v3.5.18

    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision  # 自动清理历史：按版本号
      - ETCD_AUTO_COMPACTION_RETENTION=1000  # 自动清理历史：保留1000个版本
      - ETCD_QUOTA_BACKEND_BYTES=4294967296  # 后端数据量限制：4GB
      - ETCD_SNAPSHOT_COUNT=50000  # 快照生成阈值：50000个条目
    volumes:
      - ./volumes/etcd:/etcd   # 元数据存到宿主机（持久化）

    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: quay.m.daocloud.io/minio/minio:RELEASE.2024-05-28T17-19-04Z

    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    container_name: milvus_standalone
    image: docker.m.daocloud.io/milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379              # ★ 告诉 Milvus：etcd 在哪 → 用"服务名"找！
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"                        # ★ SDK 连接口（你的 Python 代码连这个）
      - "9091:9091"
    depends_on:
      - etcd
      - minio